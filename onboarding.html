<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set up your profile — Accord</title>
  <meta name="description" content="Answer a few quick questions so Accord can auto-fill more of every Google Form you open." />
  <meta name="theme-color" content="#080808" />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <link rel="apple-touch-icon" href="public/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Urbanist:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .ob-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 24px 40px;
    }
    .ob-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 36px;
    }
    .ob-top .logo { text-decoration: none; }
    .ob-skip-all {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 6px 0;
      transition: color 0.15s;
    }
    .ob-skip-all:hover { color: var(--text-dim); }

    /* progress */
    .ob-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .ob-progress-bar {
      flex: 1;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .ob-progress-fill {
      height: 100%;
      width: 0;
      background: rgba(255,255,255,0.85);
      transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ob-progress-count {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      min-width: 46px;
      text-align: right;
    }

    /* step */
    .ob-step {
      display: flex;
      flex-direction: column;
      animation: obIn 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ob-step.is-leaving { animation: obOut 0.18s ease forwards; }
    @keyframes obIn  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes obOut { to   { opacity: 0; transform: translateY(-10px); } }

    .ob-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(240,240,240,0.4);
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    .ob-question {
      font-family: var(--display);
      font-size: 36px;
      font-weight: 300;
      letter-spacing: -0.025em;
      line-height: 1.12;
      margin-bottom: 12px;
    }
    .ob-hint {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(240,240,240,0.45);
      margin-bottom: 26px;
      max-width: 460px;
    }
    .ob-input {
      font-size: 18px;
      padding: 15px 18px;
    }
    .ob-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .ob-chip {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-dim);
      border-radius: 100px;
      padding: 8px 16px;
      font-family: var(--body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ob-chip:hover { color: var(--text); border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); }
    .ob-chip.is-active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
    .ob-sub {
      margin-top: 18px;
    }
    .ob-sub-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .ob-fills-note {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(240,240,240,0.3);
      margin-top: 14px;
      line-height: 1.6;
    }
    .ob-fills-note code {
      color: rgba(240,240,240,0.5);
      background: rgba(255,255,255,0.05);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .ob-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 36px;
      flex-wrap: wrap;
    }
    .ob-actions .btn-primary { padding: 13px 26px; }
    .ob-back {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--body);
      font-size: 13px;
      cursor: pointer;
      padding: 10px 6px;
      margin-right: auto;
      transition: color 0.15s;
    }
    .ob-back:hover { color: var(--text-dim); }
    .ob-back[hidden] { display: none; }
    .ob-enter-hint {
      display: none;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    @media (min-width: 640px) and (hover: hover) { .ob-enter-hint { display: inline; } }

    /* done */
    .ob-summary {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .ob-summary-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
    }
    .ob-summary-row .k { color: var(--text-dim); font-size: 12px; font-family: var(--mono); letter-spacing: 0.04em; flex-shrink: 0; }
    .ob-summary-row .v { color: var(--text); text-align: right; overflow-wrap: anywhere; }
    .ob-done-mark {
      font-family: var(--display);
      font-style: italic;
      font-size: 56px;
      line-height: 1;
      color: rgba(240,240,240,0.9);
      margin-bottom: 18px;
    }

    @media (max-width: 480px) {
      .ob-shell { padding: 16px 18px 28px; }
      .ob-question { font-size: 30px; }
      .ob-top { margin-bottom: 26px; }
      .ob-actions .btn { flex: 1 1 auto; justify-content: center; }
      .ob-back { flex-basis: 100%; margin-right: 0; order: 3; text-align: left; }
    }
  </style>
</head>
<body>

<div class="preloader" id="preloader">
  <div class="preloader-mark">a.</div>
</div>

<div class="orb" style="width:520px;height:520px;background:radial-gradient(circle,rgba(255,255,255,0.018) 0%,transparent 60%);top:-200px;right:-140px;filter:blur(80px);"></div>

<div class="ob-shell">
  <div class="ob-top">
    <a href="/dashboard" class="logo">
      <div class="logo-mark">a.</div>
      <span class="logo-text">Accord</span>
    </a>
    <button class="ob-skip-all" id="ob-skip-all" type="button">Skip for now</button>
  </div>

  <div class="ob-progress" id="ob-progress">
    <div class="ob-progress-bar"><div class="ob-progress-fill" id="ob-progress-fill"></div></div>
    <span class="ob-progress-count" id="ob-progress-count"></span>
  </div>

  <form class="ob-step" id="ob-step" autocomplete="on" novalidate></form>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/onboarding.js"></script>
</body>
</html>
