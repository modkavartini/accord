plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.accord.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.accord.app"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    // Release signing comes from android/keystore.properties (git-ignored):
    //   storeFile=/path/to/accord-release.jks
    //   storePassword=…  keyAlias=accord  keyPassword=…
    // The key's SHA-1 must be registered in Firebase → Project settings →
    // Android app, or Google Sign-In fails in that build. Without the file
    // (fresh clone, CI without secrets) release falls back to the debug key
    // so `assembleRelease` still produces an installable build.
    def keystoreProps = new Properties()
    def keystoreFile  = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

    signingConfigs {
        debugKey {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (keystoreProps['storeFile']) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : signingConfigs.debugKey
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.webkit:webkit:1.12.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'

    // Google Sign-In (Play services). Provides the native OAuth picker so the
    // sign-in flow doesn't have to run inside the WebView — Google blocks
    // OAuth in third-party WebViews with 'disallowed_useragent'.
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
