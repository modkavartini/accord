plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.accord.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.accord.app"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    // No dedicated release keystore exists yet — release builds are signed
    // with the debug key so they install/upgrade over debug builds and the
    // registered debug SHA-1 keeps Google Sign-In working. Swap this for a
    // real keystore (and register its SHA-1 in Firebase) before a store release.
    signingConfigs {
        debugKey {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debugKey
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.webkit:webkit:1.12.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'

    // Google Sign-In (Play services). Provides the native OAuth picker so the
    // sign-in flow doesn't have to run inside the WebView — Google blocks
    // OAuth in third-party WebViews with 'disallowed_useragent'.
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
